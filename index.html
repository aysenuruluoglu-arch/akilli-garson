
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Akıllı Garson</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      text-align: center;
      padding: 60px 20px;
      color: #222;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000012;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Akıllı Garson</h1>
    <p>NFC Garson Çağırma Sistemi</p>
    <p>Uygulama kurulumu başarılı!</p>
    <button onclick="alert('Test başarılı!')">
      Sistemi Test Et
    </button>
  </div>
</body>
</html>
