
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13243a">
  <meta name="referrer" content="no-referrer">

  <title>Akıllı Garson | Masa Hizmeti</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #17263c;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 24px;
      padding: 30px 23px;
      box-shadow: 0 10px 35px #14243b14;
      text-align: center;
    }

    .logo {
      font-weight: 800;
      font-size: 24px;
      letter-spacing: -.7px;
    }

    .subtitle {
      color: #8190a2;
      font-size: 13px;
      margin-top: 8px;
    }

    .table-card {
      background: #eef3fa;
      padding: 30px 15px;
      border-radius: 19px;
      margin: 30px 0 25px;
    }

    .welcome {
      font-size: 11px;
      letter-spacing: 2px;
      color: #74869c;
      font-weight: bold;
    }

    .table-number {
      font-size: 42px;
      font-weight: 800;
      margin: 12px 0;
    }

    .description {
      font-size: 14px;
      color: #617187;
    }

    button {
      width: 100%;
      padding: 19px;
      border: 0;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 13px;
    }

    .primary {
      background: #245bda;
      color: #fff;
    }

    .secondary {
      background: #edf2f9;
      color: #213a60;
    }

    .cancel {
      background: #fff1f1;
      color: #b42328;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      background: #edf8f1;
      color: #207044;
      display: none;
    }

    #status.error {
      background: #fff1f1;
      color: #b42328;
    }

    .footer {
      margin-top: 23px;
      color: #a0a9b7;
      font-size: 11px;
    }

    .notice {
      margin-top: 12px;
      font-size: 12px;
      color: #7a8796;
    }
  </style>
</head>

<body>
  <main class="app">

    <div class="logo">Akıllı Garson</div>

    <div class="subtitle">
      Dijital masa hizmet sistemi
    </div>

    <section class="table-card">
      <div class="welcome">HOŞ GELDİNİZ</div>

      <div class="table-number" id="tableTitle">
        Masa
      </div>

      <div class="description">
        Size nasıl yardımcı olabiliriz?
      </div>
    </section>

    <div id="actions">

      <button class="primary" id="waiterBtn">
        🔔 Garson Çağır
      </button>

      <button class="secondary" id="billBtn">
        🧾 Hesap İste
      </button>

    </div>

    <div id="status"
         role="status"
         aria-live="polite"></div>

    <button class="cancel"
            id="cancelBtn"
            style="display:none">
      İsteği İptal Et
    </button>

    <div class="notice" id="notice">
      NFC veya QR ile masa hizmeti
    </div>

    <div class="footer">
      Akıllı Garson • Demo
    </div>

  </main>

  <script>
    "use strict";

    // API ADRESLERI
    const API_BASE =
      "https://2vcjhcky.rpcld.app/webhook";

    const CREATE_URL =
      API_BASE + "/akilli-garson-call";

    const CANCEL_URL =
      API_BASE + "/akilli-garson-cancel";

    // NFC TOKENINI URL'DEN AL
    const params = new URLSearchParams(
      window.location.search
    );

    const token = params.get("token") || "";

    const validToken =
      /^[a-f0-9]{48}$/.test(token);

    // EKRAN ELEMANLARI
    const title =
      document.getElementById("tableTitle");

    const waiterBtn =
      document.getElementById("waiterBtn");

    const billBtn =
      document.getElementById("billBtn");

    const cancelBtn =
      document.getElementById("cancelBtn");

    const statusBox =
      document.getElementById("status");

    const notice =
      document.getElementById("notice");

    let busy = false;
    let request = null;

    // Her masa icin ayri oturum kaydi
    const storageKey =
      "akilli_garson_request_" + token;

    function saveRequest(data) {
      request = data;

      try {
        sessionStorage.setItem(
          storageKey,
          JSON.stringify(data)
        );
      } catch (error) {
        console.warn(
          "Oturum kaydedilemedi."
        );
      }
    }

    function clearRequest() {
      request = null;

      try {
        sessionStorage.removeItem(storageKey);
      } catch (error) {
        console.warn(
          "Oturum temizlenemedi."
        );
      }
    }

    function restoreRequest() {
      if (!validToken) return;

      try {
        const saved =
          sessionStorage.getItem(storageKey);

        if (!saved) return;

        const data = JSON.parse(saved);

        if (
          data &&
          data.call_id &&
          /^[a-f0-9]{64}$/.test(
            data.cancel_token || ""
          )
        ) {
          request = data;
        }
      } catch (error) {
        clearRequest();
      }
    }

    function showStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.style.display = "block";
      statusBox.classList.toggle(
        "error",
        isError
      );
    }

    function updateButtons() {
      waiterBtn.disabled =
        !validToken || busy || request !== null;

      billBtn.disabled =
        !validToken || busy || request !== null;

      cancelBtn.style.display =
        request !== null ? "block" : "none";

      cancelBtn.disabled = busy;
    }

    // SUNUCUYA JSON GONDER
    async function postJSON(url, body) {
      const response = await fetch(url, {
        method: "POST",
        mode: "cors",
        cache: "no-store",
        credentials: "omit",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        throw new Error(
          "Sunucu hatası: " + response.status
        );
      }

      return await response.json();
    }

    // CAGRI OLUSTUR
    async function createRequest(type) {
      if (!validToken || busy || request) {
        return;
      }

      busy = true;
      updateButtons();

      showStatus("İsteğiniz gönderiliyor...");

      try {
        const data = await postJSON(
          CREATE_URL,
          {
            token: token,
            request_type: type
          }
        );

        if (
          data.success === true &&
          data.result === "created" &&
          data.call_id &&
          /^[a-f0-9]{64}$/.test(
            data.cancel_token || ""
          )
        ) {
          saveRequest({
            call_id: data.call_id,
            cancel_token: data.cancel_token,
            request_type: type,
            table_number: data.table_number
          });

          title.textContent =
            "Masa " + data.table_number;

          showStatus(
            type === "waiter"
              ? "🔔 Garson çağrınız kaydedildi."
              : "🧾 Hesap isteğiniz kaydedildi."
          );

          notice.textContent =
            "İsteğiniz beklemede. " +
            "Garsonların bildirim sistemi henüz " +
            "demo aşamasındadır.";

        } else if (data.result === "already_open") {

          if (data.table_number) {
            title.textContent =
              "Masa " + data.table_number;
          }

          showStatus(
            "Bu masa için zaten açık bir " +
            "istek bulunuyor.",
            true
          );

        } else if (data.result === "cooldown") {

          showStatus(
            "Lütfen 15 saniye bekleyip " +
            "tekrar deneyin.",
            true
          );

        } else {

          showStatus(
            data.message ||
            "İstek oluşturulamadı.",
            true
          );
        }

      } catch (error) {
        console.error(error);

        showStatus(
          "Bağlantı sırasında sorun oluştu. " +
          "İstek kaydedilmiş olabilir; " +
          "yeniden basmadan önce bekleyin.",
          true
        );

      } finally {
        busy = false;
        updateButtons();
      }
    }

    // CAGRI IPTAL ET
    async function cancelRequest() {
      if (!request || busy || !validToken) {
        return;
      }

      busy = true;
      updateButtons();

      showStatus("İptal işlemi yapılıyor...");

      try {
        const data = await postJSON(
          CANCEL_URL,
          {
            token: token,
            call_id: request.call_id,
            cancel_token: request.cancel_token
          }
        );

        if (data.result === "cancelled") {

          clearRequest();

          showStatus(
            "✅ İsteğiniz iptal edildi."
          );

          notice.textContent =
            "Yeni bir istek oluşturmak için " +
            "15 saniye bekleyin.";

        } else if (
          data.result === "already_cancelled"
        ) {

          clearRequest();

          showStatus(
            "Bu istek daha önce iptal edilmiş."
          );

        } else if (
          data.result === "already_accepted"
        ) {

          clearRequest();

          showStatus(
            "Garson isteğinizi üstlendiği için " +
            "artık iptal edemezsiniz."
          );

        } else if (
          data.result === "already_completed"
        ) {

          clearRequest();

          showStatus(
            "İsteğiniz zaten tamamlanmış."
          );

        } else {

          showStatus(
            data.message ||
            "İptal işlemi gerçekleştirilemedi.",
            true
          );
        }

      } catch (error) {
        console.error(error);

        showStatus(
          "Bağlantı hatası oluştu. " +
          "İptal durumunu doğrulayamadık.",
          true
        );

      } finally {
        busy = false;
        updateButtons();
      }
    }

    // SAYFA BASLANGICI
    if (!validToken) {

      title.textContent = "Masa bulunamadı";

      notice.textContent =
        "Lütfen masanızdaki NFC veya " +
        "QR kodunu okutun.";

      showStatus(
        "Geçerli bir masa bağlantısı bulunamadı.",
        true
      );

    } else {

      title.textContent = "Masa";

      restoreRequest();

      if (request) {

        if (request.table_number) {
          title.textContent =
            "Masa " + request.table_number;
        }

        showStatus(
          "Daha önce oluşturduğunuz istek " +
          "bu tarayıcıda kayıtlı. " +
          "Güncel durum henüz doğrulanmadı."
        );

        notice.textContent =
          "İptal etmek için aşağıdaki " +
          "butonu kullanabilirsiniz.";
      }
    }

    updateButtons();

    waiterBtn.addEventListener(
      "click",
      () => createRequest("waiter")
    );

    billBtn.addEventListener(
      "click",
      () => createRequest("bill")
    );

    cancelBtn.addEventListener(
      "click",
      cancelRequest
    );

  </script>
</body>
</html>
