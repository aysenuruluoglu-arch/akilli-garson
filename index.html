<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13243a">
<meta name="referrer" content="no-referrer">
<title>Akıllı Garson | Masa Hizmeti</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px Arial,sans-serif;background:#f3f6fa;color:#17263c;display:flex;align-items:center;justify-content:center;padding:20px}.app{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:30px 23px;box-shadow:0 10px 35px #14243b14;text-align:center}.logo{font-weight:800;font-size:24px;letter-spacing:-.7px}.subtitle{color:#8190a2;font-size:13px;margin-top:8px}.table-card{background:#eef3fa;padding:30px 15px;border-radius:19px;margin:30px 0 25px}.welcome{font-size:11px;letter-spacing:2px;color:#74869c;font-weight:bold}.table-number{font-size:42px;font-weight:800;margin:12px 0}.description{font-size:14px;color:#617187}button{width:100%;padding:19px;border:0;border-radius:13px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:13px}.primary{background:#245bda;color:#fff}.secondary{background:#edf2f9;color:#213a60}.cancel{background:#fff1f1;color:#b42328}button:disabled{opacity:.55;cursor:not-allowed}#status{margin-top:10px;padding:16px;border-radius:12px;font-size:14px;line-height:1.5;background:#edf8f1;color:#207044;display:none}#status.error{background:#fff1f1;color:#b42328}.notice{margin-top:12px;font-size:12px;color:#7a8796;line-height:1.6}
</style>
</head>
<body>
<main class="app">
<div class="logo">Akıllı Garson</div>
<div class="subtitle">Dijital masa hizmet sistemi</div>
<section class="table-card"><div class="welcome">HOŞ GELDİNİZ</div><div class="table-number" id="tableTitle">Masa</div><div class="description">Size nasıl yardımcı olabiliriz?</div></section>
<div id="actions"><button class="primary" id="waiterBtn" type="button">🔔 Garson Çağır</button><button class="secondary" id="billBtn" type="button">🧾 Hesap İste</button></div>
<div id="status" role="status" aria-live="polite"></div>
<button class="cancel" id="cancelBtn" style="display:none" type="button">İsteği İptal Et</button><button class="secondary" id="retryBtn" style="display:none" type="button">Durumu Yeniden Kontrol Et</button><button class="secondary" id="forgetBtn" style="display:none" type="button">Bu cihazdaki eski kaydı temizle</button>

</main>
<script>
"use strict";
const API_BASE = "https://2vcjhcky.rpcld.app/webhook";
const CREATE_URL = API_BASE + "/akilli-garson-call";
const CANCEL_URL = API_BASE + "/akilli-garson-cancel";
const STATUS_URL = API_BASE + "/akilli-garson-call-status";
const params = new URLSearchParams(location.search);
const token = params.get("token") || "";
const validToken = /^[a-f0-9]{48}$/.test(token);
const $ = id => document.getElementById(id);
const title = $("tableTitle"), waiterBtn = $("waiterBtn"), billBtn = $("billBtn");
const cancelBtn = $("cancelBtn"), retryBtn=$("retryBtn"), forgetBtn=$("forgetBtn"), statusBox = $("status");
const storageKey = "akilli_garson_request_" + token;
let request = null, busy = false, checking = false, callState = null, lastStatusError = false, failedChecks = 0;
function showStatus(message, error=false){statusBox.textContent=message;statusBox.style.display="block";statusBox.classList.toggle("error",error);}
function saveRequest(value){request=value;callState="pending";try{sessionStorage.setItem(storageKey,JSON.stringify(value));}catch(e){console.warn("Çağrı yerel kaydedilemedi.");}}
function clearRequest(){request=null;callState=null;try{sessionStorage.removeItem(storageKey);}catch(e){}}
function restoreRequest(){if(!validToken)return;try{const data=JSON.parse(sessionStorage.getItem(storageKey)||"null");if(data&&Number.isSafeInteger(Number(data.call_id))&&Number(data.call_id)>0&&/^[a-f0-9]{64}$/.test(data.cancel_token||"")){request=data;callState="pending";if(data.table_number)title.textContent="Masa "+data.table_number;}}catch(e){clearRequest();}}
function updateButtons(){waiterBtn.disabled=!validToken||busy||!!request;billBtn.disabled=!validToken||busy||!!request;cancelBtn.style.display=request&&callState==="pending"?"block":"none";cancelBtn.disabled=busy;retryBtn.style.display=request&&lastStatusError?"block":"none";retryBtn.disabled=busy||checking;forgetBtn.style.display=request&&lastStatusError?"block":"none";forgetBtn.disabled=busy;}
async function postJSON(url,body){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(url,{method:"POST",mode:"cors",cache:"no-store",credentials:"omit",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:controller.signal});if(!response.ok)throw new Error("HTTP "+response.status);return await response.json();}finally{clearTimeout(timeout);}}
function displayCallState(state){callState=state;lastStatusError=false;failedChecks=0;switch(state){case "pending":showStatus("⏳ Talebiniz garsonlara iletildi. Garson bekleniyor.");break;case "accepted":showStatus("✅ Garson çağrınızı üstlendi. Sizinle ilgilenecek, lütfen bekleyin.");break;case "completed":clearRequest();showStatus("✅ Talebiniz tamamlandı.");break;case "cancelled":clearRequest();showStatus("İsteğiniz iptal edildi.");break;}updateButtons();}
function unpackResponse(raw){
  let value=raw;
  if(Array.isArray(value))value=value[0];
  if(value&&typeof value==='object'&&value.body)value=value.body;
  if(typeof value==='string'){try{value=JSON.parse(value);}catch{}}
  return value&&typeof value==='object'?value:{};
}
async function checkCallStatus(){
  if(!request||!validToken||busy||checking)return;
  checking=true;updateButtons();
  const current=request;
  try{
    const data=unpackResponse(await postJSON(STATUS_URL,{token,call_id:current.call_id,cancel_token:current.cancel_token}));
    if(request!==current)return;
    const state=data.status||data.call_status;
    if((data.success===true||data.result==='ok')&&['pending','accepted','completed','cancelled'].includes(state)){
      displayCallState(state);
    }else{
      throw new Error('API durum cevabı geçersiz: '+String(data.result||data.message||'status yok'));
    }
  }catch(e){
    if(request!==current)return;
    failedChecks++;
    lastStatusError=true;
    showStatus('⚠️ Çağrı durumu güncellenemiyor. Talebiniz kaydedilmiş olabilir; yeniden göndermeyin.',true);
    console.warn("Durum sorgusu başarısız:", e);
  }finally{checking=false;updateButtons();}
}
async function createRequest(type){if(!validToken||busy||request)return;busy=true;updateButtons();showStatus("İsteğiniz gönderiliyor...");try{const data=unpackResponse(await postJSON(CREATE_URL,{token,request_type:type}));if(data.success===true&&data.result==="created"&&data.call_id&&/^[a-f0-9]{64}$/.test(data.cancel_token||"")){saveRequest({call_id:data.call_id,cancel_token:data.cancel_token,request_type:type,table_number:data.table_number});if(data.table_number)title.textContent="Masa "+data.table_number;displayCallState("pending");}else if(data.result==="already_open"){if(data.table_number)title.textContent="Masa "+data.table_number;showStatus("Bu masa için zaten açık bir istek bulunuyor.",true);}else if(data.result==="cooldown"){showStatus("Yeni çağrı için 15 saniye bekleyin.",true);}else{showStatus(data.message||"İstek oluşturulamadı.",true);}}catch(e){showStatus("Bağlantı sırasında sorun oluştu. Çağrı kaydedilmiş olabilir, yeniden basmadan önce bekleyin.",true);}finally{busy=false;updateButtons();if(request)checkCallStatus();}}
async function cancelRequest(){if(!request||busy||!validToken||callState!=="pending")return;busy=true;updateButtons();const current=request;showStatus("İptal işlemi yapılıyor...");try{const data=unpackResponse(await postJSON(CANCEL_URL,{token,call_id:current.call_id,cancel_token:current.cancel_token}));if(data.result==="cancelled"||data.result==="already_cancelled"){displayCallState("cancelled");}else if(data.result==="already_accepted"){displayCallState("accepted");}else if(data.result==="already_completed"){displayCallState("completed");}else{showStatus(data.message||"İptal işlemi gerçekleştirilemedi.",true);}}catch(e){showStatus("Bağlantı hatası. İptal durumunu doğrulayamadık; lütfen bekleyin.",true);}finally{busy=false;updateButtons();if(request)checkCallStatus();}}
if(!validToken){title.textContent="Masa bulunamadı";showStatus("Geçerli bir masa bağlantısı bulunamadı.",true);}else{restoreRequest();if(request){showStatus("⏳ Açık çağrınızın durumu kontrol ediliyor...");checkCallStatus();}}
updateButtons();waiterBtn.addEventListener("click",()=>createRequest("waiter"));billBtn.addEventListener("click",()=>createRequest("bill"));cancelBtn.addEventListener("click",cancelRequest);retryBtn.addEventListener("click",checkCallStatus);forgetBtn.addEventListener("click",()=>{if(!confirm("Bu işlem yalnızca bu cihazın eski kaydını temizler. Sunucudaki açık çağrıyı iptal ETMEZ. Devam edilsin mi?"))return;clearRequest();lastStatusError=false;showStatus("Yerel eski kayıt temizlendi. Sunucuda açık bir çağrı varsa yeni istek engellenebilir.");updateButtons();});
setInterval(()=>{if(!document.hidden)checkCallStatus();},2000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkCallStatus();});
</script>
</body>
</html>
