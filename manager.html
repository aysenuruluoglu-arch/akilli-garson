
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13243a">
<meta name="referrer" content="no-referrer">

<title>Akıllı Garson | Yönetici Paneli</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 14px;
  background: #f3f6fa;
  color: #17263c;
  font: 15px Arial, sans-serif;
}

.app {
  max-width: 480px;
  margin: auto;
}

.header {
  background: #13243a;
  color: white;
  padding: 25px 22px;
  border-radius: 20px;
  margin-bottom: 16px;
}

.brand {
  font-size: 23px;
  font-weight: 800;
}

.sub {
  color: #b9c8da;
  font-size: 13px;
  margin-top: 6px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 17px;
  margin-bottom: 15px;
  box-shadow: 0 5px 18px #14243b0b;
}

h2 {
  margin: 0 0 16px;
  font-size: 19px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 13px;
  margin: 14px 0 7px;
}

input {
  padding: 14px;
  border: 1px solid #dbe3ee;
  border-radius: 10px;
  width: 100%;
  font-size: 16px;
}

button {
  padding: 12px 15px;
  border: none;
  border-radius: 11px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.55;
  cursor: wait;
}

.primary {
  background: #245bda;
  color: white;
  width: 100%;
  margin-top: 17px;
}

.secondary {
  background: #edf2f9;
  color: #213a60;
}

.logout {
  background: #30445e;
  color: white;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.muted {
  color: #8290a2;
  font-size: 12px;
  line-height: 1.5;
}

.message {
  padding: 13px;
  border-radius: 11px;
  background: #e7f6ed;
  color: #17683b;
  margin: 12px 0;
  font-size: 13px;
  line-height: 1.5;
}

.message.error {
  background: #fff0f0;
  color: #ae232a;
}

.hidden {
  display: none !important;
}

.staff {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 17px 0;
  border-bottom: 1px solid #edf0f5;
}

.staff:last-child {
  border-bottom: none;
}

.name {
  font-size: 16px;
  font-weight: 700;
}

.status {
  font-size: 12px;
  color: #79869a;
  margin-top: 5px;
}

.switch {
  border-radius: 20px;
  min-width: 94px;
  background: #e4e9f1;
  color: #4b596b;
}

.switch.on {
  background: #def5e6;
  color: #166839;
}

.count {
  font-size: 13px;
  color: #63758b;
  margin-top: 8px;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #8793a5;
  padding: 10px;
}
</style>
</head>

<body>

<main class="app">

  <header class="header">
    <div class="brand">Akıllı Garson</div>
    <div class="sub">Restoran Yönetici Paneli</div>
  </header>

  <!-- YONETICI GIRISI -->

  <section id="loginScreen" class="card">

    <h2>Yönetici Girişi</h2>

    <form id="loginForm">

      <label for="staffId">
        Yönetici Personel Numarası
      </label>

      <input
        id="staffId"
        type="number"
        min="1"
        step="1"
        inputmode="numeric"
        value="5"
        autocomplete="username"
        required
      >

      <label for="password">
        Şifre
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Yönetici şifresi"
        required
      >

      <button
        id="loginBtn"
        type="submit"
        class="primary"
      >
        Giriş Yap
      </button>

    </form>

    <div
      id="loginMessage"
      class="message hidden"
      role="status"
    ></div>

  </section>

  <!-- YONETICI PANELI -->

  <section id="dashboard" class="hidden">

    <div class="card">

      <div class="top">

        <div>
          <strong id="managerName">
            Restoran Yöneticisi
          </strong>

          <div class="muted">
            Personel vardiya kontrolü
          </div>
        </div>

        <button
          id="logoutBtn"
          class="logout"
          type="button"
        >
          Çıkış
        </button>

      </div>

    </div>

    <!-- PERSONEL LISTESI -->

    <div class="card">

      <div class="top">

        <h2 style="margin:0">
          Personeller
        </h2>

        <button
          id="refreshBtn"
          class="secondary"
          type="button"
        >
          ↻ Yenile
        </button>

      </div>

      <div id="summary" class="count">
        Liste henüz yüklenmedi.
      </div>

      <div id="staffList"></div>

      <div
        id="dashboardMessage"
        class="message hidden"
        role="status"
      ></div>

    </div>

  </section>

  <div class="footer">
    Akıllı Garson • Yönetici Paneli
  </div>

</main>

<script>
"use strict";

// ====================================
// API AYARLARI
// ====================================

const BASE =
  "https://2vcjhcky.rpcld.app/webhook";

const API = {
  login:
    BASE + "/akilli-garson-staff-login",

  list:
    BASE + "/akilli-garson-manager-staff-list",

  update:
    BASE + "/akilli-garson-manager-staff-update",

  logout:
    BASE + "/akilli-garson-staff-logout"
};

const RESTAURANT = "akilli-garson-demo";

const SESSION_KEY =
  "akilli_garson_manager_session";

const $ = id =>
  document.getElementById(id);

let session = null;
let busy = false;

// ====================================
// MESAJLAR
// ====================================

function showMessage(id, text, error = false) {
  const element = $(id);

  element.textContent = text;

  element.className =
    "message" + (error ? " error" : "");
}

function hideMessage(id) {
  $(id).className = "message hidden";
}

// ====================================
// OTURUM
// ====================================

function validSession(data) {
  return Boolean(
    data &&
    typeof data.token === "string" &&
    /^[a-f0-9]{64}$/i.test(data.token) &&
    data.staff &&
    data.staff.role === "manager" &&
    data.expires_at &&
    Date.parse(data.expires_at) > Date.now()
  );
}

function saveSession(data) {
  session = data;

  sessionStorage.setItem(
    SESSION_KEY,
    JSON.stringify(data)
  );
}

function clearSession() {
  session = null;

  sessionStorage.removeItem(
    SESSION_KEY
  );
}

function showLogin() {
  $("loginScreen").classList.remove(
    "hidden"
  );

  $("dashboard").classList.add(
    "hidden"
  );

  $("password").value = "";
}

function showDashboard() {
  $("loginScreen").classList.add(
    "hidden"
  );

  $("dashboard").classList.remove(
    "hidden"
  );

  $("managerName").textContent =
    session.staff.name ||
    "Restoran Yöneticisi";

  $("staffList").replaceChildren();

  $("summary").textContent =
    "Personeller yükleniyor...";

  hideMessage("dashboardMessage");
}

function expireSession() {
  clearSession();
  showLogin();

  showMessage(
    "loginMessage",
    "Oturum geçersiz veya süresi dolmuş. Tekrar giriş yapın.",
    true
  );
}

// ====================================
// API ISTEKLERI
// ====================================

async function postJSON(url, body) {
  const controller = new AbortController();

  const timeout = setTimeout(
    () => controller.abort(),
    15000
  );

  try {
    const response = await fetch(url, {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      cache: "no-store",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(body),
      signal: controller.signal
    });

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    return await response.json();

  } finally {
    clearTimeout(timeout);
  }
}

// ====================================
// YONETICI GIRISI
// ====================================

$("loginForm").addEventListener(
  "submit",
  async event => {
    event.preventDefault();

    if (busy) return;

    busy = true;
    $("loginBtn").disabled = true;

    hideMessage("loginMessage");

    let loggedIn = false;

    try {
      const id = Number(
        $("staffId").value
      );

      const password =
        $("password").value;

      const data = await postJSON(
        API.login,
        {
          restaurant: RESTAURANT,
          staff_id: id,
          password: password
        }
      );

      const candidate = {
        token: data.session_token,
        staff: data.staff,
        expires_at: data.expires_at
      };

      if (
        data.success === true &&
        data.result === "authenticated" &&
        validSession(candidate)
      ) {
        saveSession(candidate);
        showDashboard();
        loggedIn = true;

      } else {
        showMessage(
          "loginMessage",
          data.message ||
          "Giriş başarısız veya yönetici yetkisi yok.",
          true
        );
      }

    } catch (error) {
      showMessage(
        "loginMessage",
        "Giriş bağlantısı başarısız: " +
        error.message,
        true
      );

    } finally {
      busy = false;
      $("loginBtn").disabled = false;
    }

    // Giriş tamamlandıktan sonra
    // personel listesini yükle.

    if (loggedIn) {
      await loadStaff();
    }
  }
);

// ====================================
// PERSONEL KARTI
// ====================================

function createStaffRow(person) {
  const row = document.createElement(
    "div"
  );

  row.className = "staff";

  const left = document.createElement(
    "div"
  );

  const name = document.createElement(
    "div"
  );

  name.className = "name";
  name.textContent = person.name;

  const status = document.createElement(
    "div"
  );

  status.className = "status";

  status.textContent =
    "ID: " + person.id +
    " • " +
    (
      person.is_active
        ? "Vardiyada"
        : "Vardiya dışında"
    );

  left.append(name, status);

  const button = document.createElement(
    "button"
  );

  button.className =
    "switch" +
    (person.is_active ? " on" : "");

  button.type = "button";

  button.textContent =
    person.is_active
      ? "Aktif"
      : "Pasif";

  button.setAttribute(
    "aria-label",
    person.name + " durumunu değiştir"
  );

  button.addEventListener(
    "click",
    () => changeStatus(person, button)
  );

  row.append(left, button);

  return row;
}

// ====================================
// PERSONEL LISTESI
// ====================================

async function loadStaff() {
  if (!session || busy) return;

  if (!validSession(session)) {
    expireSession();
    return;
  }

  busy = true;
  $("refreshBtn").disabled = true;

  const token = session.token;

  try {
    const data = await postJSON(
      API.list,
      {
        session_token: token
      }
    );

    if (
      !session ||
      session.token !== token
    ) {
      return;
    }

    if (
      data.success !== true ||
      !Array.isArray(data.staff)
    ) {
      showMessage(
        "dashboardMessage",
        data.message ||
        "Personel listesi alınamadı.",
        true
      );

      return;
    }

    hideMessage("dashboardMessage");

    const people = data.staff;

    $("staffList").replaceChildren();

    const activeCount = people.filter(
      person => person.is_active === true
    ).length;

    $("summary").textContent =
      people.length +
      " garson • " +
      activeCount +
      " aktif";

    if (people.length === 0) {
      const empty = document.createElement(
        "p"
      );

      empty.className = "muted";

      empty.textContent =
        "Henüz garson bulunmuyor.";

      $("staffList").append(empty);

    } else {
      people.forEach(person => {
        $("staffList").append(
          createStaffRow(person)
        );
      });
    }

  } catch (error) {
    showMessage(
      "dashboardMessage",
      "Liste alınamadı: " + error.message,
      true
    );

  } finally {
    busy = false;
    $("refreshBtn").disabled = false;
  }
}

// ====================================
// AKTIF / PASIF DEGISTIRME
// ====================================

async function changeStatus(person, button) {
  if (busy || !session) return;

  if (!validSession(session)) {
    expireSession();
    return;
  }

  busy = true;
  button.disabled = true;

  const token = session.token;

  const nextActive =
    person.is_active !== true;

  try {
    const data = await postJSON(
      API.update,
      {
        session_token: token,
        staff_id: Number(person.id),
        is_active: nextActive
      }
    );

    if (
      !session ||
      session.token !== token
    ) {
      return;
    }

    if (
      data.success === true &&
      data.result === "updated"
    ) {
      person.is_active = nextActive;

      button.textContent =
        nextActive ? "Aktif" : "Pasif";

      button.className =
        "switch" +
        (nextActive ? " on" : "");

      button.parentElement
        .querySelector(".status")
        .textContent =
          "ID: " + person.id +
          " • " +
          (
            nextActive
              ? "Vardiyada"
              : "Vardiya dışında"
          );

      const total =
        $("staffList").children.length;

      const active =
        $("staffList")
          .querySelectorAll(".switch.on")
          .length;

      $("summary").textContent =
        total +
        " garson • " +
        active +
        " aktif";

      showMessage(
        "dashboardMessage",
        person.name +
        (
          nextActive
            ? " aktif edildi."
            : " pasife alındı."
        )
      );

    } else {
      showMessage(
        "dashboardMessage",
        data.message ||
        "İşlem gerçekleştirilemedi.",
        true
      );
    }

  } catch (error) {
    showMessage(
      "dashboardMessage",
      "Güncelleme başarısız: " +
      error.message,
      true
    );

  } finally {
    busy = false;
    button.disabled = false;
  }
}

// ====================================
// YENILE
// ====================================

$("refreshBtn").addEventListener(
  "click",
  loadStaff
);

// ====================================
// CIKIS
// ====================================

$("logoutBtn").addEventListener(
  "click",
  async () => {
    if (busy) return;

    busy = true;
    $("logoutBtn").disabled = true;

    const token = session?.token;

    let confirmed = false;

    try {
      if (token) {
        const data = await postJSON(
          API.logout,
          {
            session_token: token
          }
        );

        confirmed =
          data.result === "logged_out" ||
          data.result === "unauthorized";
      }

    } catch (error) {
      console.warn(
        "Sunucu çıkışı doğrulanamadı."
      );

    } finally {
      clearSession();
      showLogin();

      showMessage(
        "loginMessage",
        confirmed
          ? "Çıkış yapıldı."
          : "Cihazdaki oturum kapatıldı. Sunucu çıkışı doğrulanamadı.",
        !confirmed
      );

      $("logoutBtn").disabled = false;
      busy = false;
    }
  }
);

// ====================================
// SAYFA ACILISI
// ====================================

try {
  const saved = JSON.parse(
    sessionStorage.getItem(SESSION_KEY) ||
    "null"
  );

  if (validSession(saved)) {
    session = saved;
    showDashboard();
    loadStaff();

  } else {
    clearSession();
    showLogin();
  }

} catch (error) {
  clearSession();
  showLogin();
}
</script>

</body>
</html>
